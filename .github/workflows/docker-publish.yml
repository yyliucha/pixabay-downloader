name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # GitHub 限制: secrets 不能直接在 if 条件中使用, 先绑定到 env 再判断
    env:
      DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN Secrets 时自动跳过,
      # 配置后(仓库 Settings → Secrets and variables → Actions)即刻生效。
      # 触发规则: 推 main → latest; 打 v* 标签 → vX.Y.Z + latest
      - name: Login to Docker Hub
        if: ${{ env.DH_USERNAME != '' && env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USERNAME }}
          password: ${{ env.DH_TOKEN }}

      - name: Extract metadata
        id: meta
        if: ${{ env.DH_USERNAME != '' && env.DH_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DH_USERNAME }}/pixabay-downloader
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push to Docker Hub
        if: ${{ env.DH_USERNAME != '' && env.DH_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
